name: Quality

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: ESLint 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  package:
    name: npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm pack --dry-run

  test:
    name: Node ${{ matrix.node-version }} / ESLint ${{ matrix.eslint-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node-version: 18.18.0
            eslint-version: 9
          - node-version: 20
            eslint-version: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save eslint@${{ matrix.eslint-version }}
      - run: npm test
