name: Copilot Review

# Copilot assignment and reassignment rules:
# - Wait for the entire Quality workflow: lint, package, and every test job.
# - Assign Copilot after the first successful pull request run.
# - Reassign Copilot after later successful runs to review new commits.
# - Never assign on failed/cancelled checks, push runs, or draft pull requests.
# workflow_run provides write access for fork PRs. No PR code is executed here.
on:
  workflow_run:
    workflows:
      - Quality
    types:
      - completed

permissions:
  pull-requests: write

jobs:
  request-review:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.pull_requests[0].number != null
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request Copilot review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          draft=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.draft')

          if [ "$draft" = "true" ]; then
            echo "Skipping Copilot review for draft pull request."
            exit 0
          fi

          pull_request_id=$(gh pr view "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --json id \
            --jq '.id')

          gh api graphql \
            -F pullRequestId="$pull_request_id" \
            -f 'botLogins[]=copilot-pull-request-reviewer[bot]' \
            -f query='mutation($pullRequestId: ID!, $botLogins: [String!]) {
              requestReviewsByLogin(input: {
                pullRequestId: $pullRequestId,
                botLogins: $botLogins,
                union: true
              }) {
                clientMutationId
              }
            }'
